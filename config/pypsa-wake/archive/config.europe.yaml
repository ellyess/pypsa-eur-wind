# ============================================================================
# HARMONISED EUROPE CONFIG (SECTOR-COUPLED) -- Applied Energy wake paper
# ============================================================================
# Continental transferability check for the manuscript, SECTOR-COUPLED to match
# the canonical North Sea endogenous-deployment experiment
# (config.northsea-sector.yaml). Decision 2026-07-13: Europe is sector-coupled,
# NOT electricity-only, so that the continental run tests exactly the regime the
# paper's deployment results come from (offshore competes on its own economics;
# no capacity floor needed).
#
# Same per-unit settings as the North Sea configs (dominant mode, 12 MW
# turbines, capacity_per_sqkm 4, correction_factor 1, 2023 ERA5, 2030, 6 h);
# differs ONLY in domain (25 countries, 31 buses, full European offshore).
# Everything not set here inherits config.default.yaml (incl. the full
# `sector:` block). Scenarios live in config/pypsa-wake/scenarios.yaml.
#
# Wake models: per the approved paper scope Europe is a transferability check
# for TierDensity, so only base (NoWake) + new_more (TierDensity) are active.
# Uncomment the standard/glaum blocks to also test Uniform + TierCap collapse
# at continental scale.
# ============================================================================

foresight: overnight

run:
  # 31 buses, not 30: current upstream's cluster_network requires at least one
  # bus per country-subnetwork, which is 31 for this 25-country selection
  # ("Number of clusters must be 31 <= n_clusters <= 3676").
  prefix: "paper-europe-sector-2030-31-dominant-6h"
  name:
    # --- No-wake baseline (NoWake)
    - base-s1000000-biasFalse
    - base-s100000-biasFalse
    - base-s10000-biasFalse
    # --- Density tiers (TierDensity, this work)
    - new_more-s1000000-biasFalse
    - new_more-s100000-biasFalse
    - new_more-s10000-biasFalse
    # optional -- add Uniform / TierCap at continental scale:
    # - standard-s1000000-biasFalse
    # - standard-s100000-biasFalse
    # - standard-s10000-biasFalse
    # - glaum-s1000000-biasFalse
    # - glaum-s100000-biasFalse
    # - glaum-s10000-biasFalse
  scenarios:
    enable: true
    file: config/pypsa-wake/scenarios.yaml
  # See config.northsea.yaml: `policy: base` is broken on upstream master.
  shared_resources:
    policy: false

scenario:
  clusters:
    - 31
  opts:
    - ''
  sector_opts:
    - ''
  planning_horizons:
    - 2030

countries: ['AL', 'AT', 'BA', 'BE', 'BG', 'CH', 'CZ', 'DE', 'DK', 'ES', 'FR', 'GB', 'GR', 'HR', 'IE', 'IT', 'LU', 'ME', 'MK', 'NL', 'NO', 'PT', 'RS', 'SE', 'SI']

snapshots:
  start: "2023-01-01"
  end: "2024-01-01"

# Sector-wide CO2 budget as a fraction of 1990 emissions of the modelled
# countries; 2030 = 0.297 (~ -70%), same as the North Sea sector run.
co2_budget:
  2030: 0.297

# Fork-specific: variable OFFSHORE spatial resolution, dominant offshore mode.
# sea_shape empty -> full European offshore domain (not clipped to the North Sea).
spatial_mods:
  mode: dominant
  sea_shape:
  shared_files: europe
  offshore_threshold: 100000      # overridden per scenario
  onshore_threshold: false        # onshore NOT split (offshore resolution only)

electricity:
  # Sector coupling constrains CO2 via `co2_budget`, NOT the electricity-only cap.
  co2limit_enable: false
  wake_model:
    method: base                  # overridden per scenario
  extendable_carriers:
    Generator: [offwind-ac, offwind-dc, offwind-float, onwind, solar]
    StorageUnit: [battery]
    Store: []
    Link: []
  powerplants_filter: (DateOut >= 2023 or DateOut != DateOut) and not (Country == 'Germany' and Fueltype == 'Nuclear')
  estimate_renewable_capacities:
    enable: false
  transmission_limit: vopt

atlite:
  default_cutout: europe-2023-sarah3-era5
  nprocesses: 2
  cutouts:
    europe-2023-sarah3-era5:
      module: [sarah, era5]
      x: [-12., 42.]
      y: [33., 72.]
      dx: 0.3
      dy: 0.3
      time: ['2023', '2023']

renewable:
  onwind:
    cutout: europe-2023-sarah3-era5
    resource:
      add_cutout_windspeed: true
  offwind-ac:
    cutout: europe-2023-sarah3-era5
    resource:
      turbine: NREL_ReferenceTurbine_2020ATB_12MW_offshore
      add_cutout_windspeed: true
    capacity_per_sqkm: 4
    correction_factor: 1          # wake handled by wake_model, not atlite derate
    corine: false                # offshore: no land-cover CORINE (open sea is outside its coverage)
    min_shore_distance: 1000
    landfall_length: 10
  offwind-dc:
    cutout: europe-2023-sarah3-era5
    resource:
      turbine: NREL_ReferenceTurbine_2020ATB_12MW_offshore
      add_cutout_windspeed: true
    capacity_per_sqkm: 4
    correction_factor: 1
    corine: false                # offshore: no land-cover CORINE (open sea is outside its coverage)
    landfall_length: 10
  offwind-float:
    cutout: europe-2023-sarah3-era5
    resource:
      turbine: NREL_ReferenceTurbine_2020ATB_12MW_offshore
      add_cutout_windspeed: true
    capacity_per_sqkm: 4
    correction_factor: 1
    corine: false                # offshore: no land-cover CORINE (open sea is outside its coverage)
    min_shore_distance: 1000
    landfall_length: 10

costs:
  year: 2030

clustering:
  temporal:
    # Sector-coupled solves take their temporal resolution from
    # `resolution_sector`; `resolution_elec` MUST be false (time_aggregation
    # rejects a sector model that also sets resolution_elec). 6h -> 1460 snapshots.
    resolution_elec: false
    resolution_sector: 6h

solving:
  # No capacity floor: under sector coupling offshore deploys endogenously.
  options:
    noisy_costs: false
    min_iterations: 4
    max_iterations: 6
    transmission_losses: 0
  solver:
    name: gurobi
    options: gurobi-default
  solver_options:
    gurobi-default:
      threads: 8
      BarConvTol: 1.e-6
      crossover: 0
  # 30-bus sector-coupled Europe is substantially heavier than the 10-bus North
  # Sea; allow more memory/time headroom.
  mem_mb: 150000
  runtime: 24h
