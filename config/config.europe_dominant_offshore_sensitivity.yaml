# Europe-wide sensitivity analysis config
# Uses dominant offshore mode with 12MW turbines and density-dependent wake modeling
# Overrides config.default.yaml — only fork-specific values included

run:
  prefix: "thesis-sensitivity-2030-30-europe-dominant-6h"
  name:
    # - base-s1000000-biasFalse
    # - base-s10000-biasFalse
    - base-s1000000-biasidw
    - base-s10000-biasidw
    # - new_more-s1000000-biasFalse
    # - new_more-s10000-biasFalse
    - new_more-s1000000-biasidw
    - new_more-s10000-biasidw
  scenarios:
    enable: true
    file: config/scenarios-sensitivity-europe.yaml
  shared_resources:
    policy: base

scenario:
  clusters:
    - 30
  planning_horizons:
    - 2030

countries: ['AL', 'AT', 'BA', 'BE', 'BG', 'CH', 'CZ', 'DE', 'DK', 'ES', 'FR', 'GB', 'GR', 'HR', 'IE', 'IT', 'LU', 'ME', 'MK', 'NL', 'NO', 'PT', 'RS', 'SE', 'SI']

snapshots:
  start: "2023-01-01"
  end: "2024-01-01"

# Fork-specific: variable spatial resolution and offshore mode
spatial_mods:
  mode: dominant
  sea_shape:
  shared_files: europe
  offshore_threshold: 100000
  onshore_threshold: 100000

electricity:
  wake_model:
    method: base
  extendable_carriers:
    Generator: [offwind-ac, offwind-dc, offwind-float, onwind, solar]
    StorageUnit: [battery]
    Store: []
    Link: []
  powerplants_filter: (DateOut >= 2023 or DateOut != DateOut) and not (Country == 'Germany' and Fueltype == 'Nuclear')
  estimate_renewable_capacities:
    enable: false
  transmission_limit: vopt

atlite:
  default_cutout: europe-2023-sarah3-era5
  nprocesses: 2
  cutouts:
    europe-2023-sarah3-era5:
      module: [sarah, era5]
      x: [-12., 42.]
      y: [33., 72.]
      dx: 0.3
      dy: 0.3
      time: ['2023', '2023']

renewable:
  onwind:
    cutout: europe-2023-sarah3-era5
    resource:
      add_cutout_windspeed: true
  offwind-ac:
    cutout: europe-2023-sarah3-era5
    resource:
      turbine: NREL_ReferenceTurbine_2020ATB_12MW_offshore
      add_cutout_windspeed: true
    capacity_per_sqkm: 4
    correction_factor: 1
    corine: [44, 255]
    min_shore_distance: 1000
    landfall_length: 10
  offwind-dc:
    cutout: europe-2023-sarah3-era5
    resource:
      turbine: NREL_ReferenceTurbine_2020ATB_12MW_offshore
      add_cutout_windspeed: true
    capacity_per_sqkm: 4
    correction_factor: 1
    corine: [44, 255]
    landfall_length: 10
  offwind-float:
    cutout: europe-2023-sarah3-era5
    resource:
      turbine: NREL_ReferenceTurbine_2020ATB_12MW_offshore
      add_cutout_windspeed: true
    capacity_per_sqkm: 4
    correction_factor: 1
    corine: [44, 255]
    min_shore_distance: 1000
    landfall_length: 10

costs:
  year: 2030

clustering:
  temporal:
    resolution_sector: 6h

solving:
  options:
    noisy_costs: false
    min_iterations: 4
    max_iterations: 6
    transmission_losses: 0
  solver_options:
    gurobi-default:
      threads: 8
      BarConvTol: 1.e-6
  mem_mb: 100000
  runtime: 6h
